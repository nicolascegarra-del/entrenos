[project]
name = "app-entrenos-backend"
version = "0.1.0"
description = "API de APP ENTRENOS: sincronización Garmin, planificación y análisis de entrenamientos."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "slowapi>=0.1.9",
    "celery[redis]>=5.4",
    "garminconnect>=0.3.17",
    "fitparse>=1.2.0",
    "cryptography>=43.0",
    "httpx>=0.28",
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
# fitparse usa utcfromtimestamp (aviso de la librería, no nuestro).
filterwarnings = ["ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning:fitparse"]
