# Desarrollo local. Para producción en Coolify, ver docker-compose.prod.yml.
name: app-entrenos

x-backend: &backend
  build: ./backend
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /data/storage
  volumes:
    - garmin_tokens:/data/garmin-tokens
    - storage:/data/storage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Migraciones y catálogo de métricas, una vez antes que el resto.
  migrate:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed-catalog"]
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      <<: *backend-env
      # Confía en X-Forwarded-For del proxy de la web para que el rate limit vea la IP real.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-l", "info", "--concurrency", "2"]
    healthcheck:
      disable: true
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    # WEB_BIND=0.0.0.0 en .env para abrirla a la red local (p. ej. verla desde el móvil en la misma wifi).
    ports: ["${WEB_BIND:-127.0.0.1}:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pg_data:
  storage:
  garmin_tokens:
