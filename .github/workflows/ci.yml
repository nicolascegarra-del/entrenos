name: CI

on:
  push:
    branches: [main, develop, v1]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: entrenos
          POSTGRES_PASSWORD: entrenos
          POSTGRES_DB: entrenos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U entrenos" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://entrenos:entrenos@127.0.0.1:5432/entrenos
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head && alembic downgrade base
      - run: pytest --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
